name: service-parser

x-common: &common
  image: ${IMAGE:-service-backend:latest}
  env_file:
    - .env
  read_only: true
  tmpfs:
    - /tmp:size=64m,noexec,nosuid
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped
  volumes:
    - news_data:/data
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - news_net

services:
  postgres:
    image: postgres:16-alpine
    container_name: service-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-news}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-news}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-news} -d ${POSTGRES_DB:-news}"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
    networks:
      - news_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: service-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    security_opt:
      - no-new-privileges:true
    networks:
      - news_net
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.0
    container_name: service-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
    security_opt:
      - no-new-privileges:true
    networks:
      - news_net
    restart: unless-stopped

  vllm:
    image: vllm/vllm-openai:v0.9.0
    container_name: service-vllm
    profiles: ["vllm"]
    command: ["--model", "${VLLM_MODEL:-Qwen/Qwen2.5-14B-Instruct}", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes:
      - vllm_cache:/root/.cache/huggingface
    ports:
      - "127.0.0.1:8001:8000"
    networks:
      - news_net
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  mailpit:
    image: axllent/mailpit:v1.33
    container_name: service-mailpit
    ports:
      - "127.0.0.1:8025:8025"
    security_opt:
      - no-new-privileges:true
    networks:
      - news_net
    restart: unless-stopped

  gateway:
    <<: *common
    container_name: service-gateway
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/usr/local/bin/gateway"]
    environment:
      APP_ENV: ${APP_ENV:-prod}
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://${POSTGRES_USER:-news}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-news}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      KAFKA_BROKERS: kafka:9092
      PIPELINE_TRANSPORT: ${PIPELINE_TRANSPORT:-grpc}
      COLLECTOR_GRPC_URL: ${COLLECTOR_GRPC_URL:-http://collector:50051}
      NORMALIZER_GRPC_URL: ${NORMALIZER_GRPC_URL:-http://normalizer:50051}
      ANALYST_GRPC_URL: ${ANALYST_GRPC_URL:-http://analyst:50051}
      CRITIC_GRPC_URL: ${CRITIC_GRPC_URL:-http://critic:50051}
      REPORTER_GRPC_URL: ${REPORTER_GRPC_URL:-http://reporter:50051}
      GRPC_TIMEOUT_SECS: ${GRPC_TIMEOUT_SECS:-600}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8000/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-Qwen2.5-14B-Instruct}
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-4}
      CRITIC_LLM: ${CRITIC_LLM:-true}
      CRITIC_MAX_LLM_CLAIMS: ${CRITIC_MAX_LLM_CLAIMS:-10}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-digest@example.local}
      SMTP_TLS: ${SMTP_TLS:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      TEST_RECIPIENT: ${TEST_RECIPIENT:-test@example.local}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      ALLOWED_SOURCE_HOSTS: ${ALLOWED_SOURCE_HOSTS:-}
      LIVE_FETCH_ENABLED: ${LIVE_FETCH_ENABLED:-true}
      METRICS_PUBLIC: ${METRICS_PUBLIC:-false}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres,redis,kafka,mailpit}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  collector:
    <<: *common
    container_name: service-collector
    command: ["/usr/local/bin/collector"]
    environment: &worker_env
      APP_ENV: ${APP_ENV:-prod}
      DATABASE_URL: postgres://${POSTGRES_USER:-news}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-news}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      KAFKA_BROKERS: kafka:9092
      PIPELINE_TRANSPORT: ${PIPELINE_TRANSPORT:-grpc}
      COLLECTOR_GRPC_URL: ${COLLECTOR_GRPC_URL:-http://collector:50051}
      NORMALIZER_GRPC_URL: ${NORMALIZER_GRPC_URL:-http://normalizer:50051}
      ANALYST_GRPC_URL: ${ANALYST_GRPC_URL:-http://analyst:50051}
      CRITIC_GRPC_URL: ${CRITIC_GRPC_URL:-http://critic:50051}
      REPORTER_GRPC_URL: ${REPORTER_GRPC_URL:-http://reporter:50051}
      GRPC_TIMEOUT_SECS: ${GRPC_TIMEOUT_SECS:-600}
      JWT_SECRET: ${JWT_SECRET}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8000/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-Qwen2.5-14B-Instruct}
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-4}
      CRITIC_LLM: ${CRITIC_LLM:-true}
      CRITIC_MAX_LLM_CLAIMS: ${CRITIC_MAX_LLM_CLAIMS:-10}
      ALLOWED_SOURCE_HOSTS: ${ALLOWED_SOURCE_HOSTS:-}
      LIVE_FETCH_ENABLED: ${LIVE_FETCH_ENABLED:-true}
      MAX_ARTICLES_PER_RUN: ${MAX_ARTICLES_PER_RUN:-60}
      SECURITY_ENRICH_ENABLED: ${SECURITY_ENRICH_ENABLED:-true}
      SECURITY_LOOKUP_CONCURRENCY: ${SECURITY_LOOKUP_CONCURRENCY:-4}
      NVD_API_BASE: ${NVD_API_BASE:-https://services.nvd.nist.gov}
      NVD_API_KEY: ${NVD_API_KEY:-}
      BDU_API_BASE: ${BDU_API_BASE:-https://bdu.fstec.ru}
      FSTEC_BDU_INSECURE_FALLBACK: ${FSTEC_BDU_INSECURE_FALLBACK:-0}
      CMDB_ENDPOINT: ${CMDB_ENDPOINT:-}
      CMDB_AUTH_TYPE: ${CMDB_AUTH_TYPE:-none}
      CMDB_AUTH_TOKEN: ${CMDB_AUTH_TOKEN:-}
      METRICS_PUBLIC: "false"
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres,redis,kafka,mailpit}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  normalizer:
    <<: *common
    container_name: service-normalizer
    command: ["/usr/local/bin/normalizer"]
    environment: *worker_env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  analyst:
    <<: *common
    container_name: service-analyst
    command: ["/usr/local/bin/analyst"]
    environment: *worker_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  critic:
    <<: *common
    container_name: service-critic
    command: ["/usr/local/bin/critic"]
    environment: *worker_env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  reporter:
    <<: *common
    container_name: service-reporter
    command: ["/usr/local/bin/reporter"]
    environment: *worker_env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    container_name: service-caddy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile.${TLS_MODE:-internal}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - news_net
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  news_data:
  vllm_cache:
  caddy_data:
  caddy_config:

networks:
  news_net:
    driver: bridge
