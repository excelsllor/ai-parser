<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
  </head>
  <body style="margin:0;padding:0;background:#fef7ff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#1d1b20;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fef7ff;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #e7dff1;border-radius:20px;overflow:hidden;">
            <tr>
              <td style="height:6px;background:#6750a4;font-size:0;line-height:0;">&nbsp;</td>
            </tr>
            <tr>
              <td style="padding:28px 32px 0;">
                <div style="font-size:13px;font-weight:700;letter-spacing:0.04em;color:#6750a4;text-transform:uppercase;">
                  CyberBug · дайджесты по кибербезопасности
                </div>
                <h1 style="margin:18px 0 0;font-size:24px;line-height:1.3;color:#1d1b20;">{{ title }}</h1>
                <p style="margin:12px 0 0;font-size:15px;line-height:1.6;color:#49454f;">{{ intro }}</p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:28px 32px;">
                <div style="display:inline-block;padding:18px 32px;border-radius:14px;background:#f3edf7;border:1px solid #e7dff1;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:34px;font-weight:700;letter-spacing:0.32em;color:#1d1b20;">
                  {{ code }}
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px;">
                <p style="margin:0;font-size:13px;line-height:1.6;color:#79747e;">{{ note }}</p>
              </td>
            </tr>
            <tr>
              <td style="padding:28px 32px 32px;">
                <div style="border-top:1px solid #e7dff1;padding-top:18px;font-size:11px;line-height:1.6;color:#79747e;">
                  CyberBug — дайджесты по кибербезопасности. Письмо отправлено автоматически, отвечать на него не нужно.
                </div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
