<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title }}</title>
</head>
<body style="margin:0;padding:0;background:#fef7ff;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fef7ff;">
<tr><td align="center" style="padding:32px 16px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #e7dff1;border-radius:20px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;">
    <tr><td style="height:6px;background:#6750a4;font-size:0;line-height:0;">&nbsp;</td></tr>
    <tr><td style="padding:28px 32px 0;">
      <span style="font-size:20px;font-weight:700;color:#1d1b20;letter-spacing:-0.02em;">CyberBug</span>
      <span style="font-size:13px;color:#6750a4;">&nbsp;·&nbsp;дайджесты по кибербезопасности</span>
    </td></tr>
    <tr><td style="padding:24px 32px 0;">
      <h1 style="margin:0 0 12px;font-size:24px;line-height:1.25;color:#1d1b20;">{{ title }}</h1>
      <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#49454f;">{{ intro }}</p>
    </td></tr>
    <tr><td style="padding:0 32px;">
      <table role="presentation" cellpadding="0" cellspacing="0"><tr>
        <td style="border-radius:12px;background:#6750a4;">
          <a href="{{ link }}" style="display:inline-block;padding:14px 28px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;">{{ button }}</a>
        </td>
      </tr></table>
    </td></tr>
    <tr><td style="padding:24px 32px 0;">
      <p style="margin:0 0 8px;font-size:12px;color:#79747e;">Если кнопка не работает, скопируйте ссылку:</p>
      <div style="padding:12px 14px;background:#f3edf7;border:1px solid #e7dff1;border-radius:10px;font-size:12px;line-height:1.5;word-break:break-all;">
        <a href="{{ link }}" style="color:#6750a4;text-decoration:none;">{{ link }}</a>
      </div>
    </td></tr>
    <tr><td style="padding:20px 32px 0;">
      <p style="margin:0;font-size:12px;line-height:1.6;color:#79747e;">{{ note }}</p>
    </td></tr>
    <tr><td style="padding:24px 32px 28px;">
      <hr style="border:0;border-top:1px solid #e7dff1;margin:0 0 16px;">
      <p style="margin:0;font-size:11px;line-height:1.6;color:#79747e;">CyberBug — дайджесты по кибербезопасности.<br>Письмо отправлено автоматически, отвечать на него не нужно.</p>
    </td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
