<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дайджест по кибербезопасности</title>
<style>
  :root {
    --bg:#0f172a; --panel:#111c33; --panel-2:#16233f; --text:#e5edf8; --muted:#93a4bf;
    --accent:#38bdf8; --accent-2:#22c55e; --danger:#ef4444; --warn:#f59e0b; --border:#22314f;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Inter, Arial, sans-serif; background:var(--bg); color:var(--text); }
  a { color:var(--accent); }
  .layout { display:flex; min-height:100vh; }
  .sidebar { width:220px; background:var(--panel); border-right:1px solid var(--border); padding:18px 14px; }
  .sidebar h1 { font-size:15px; margin:0 0 18px; color:var(--accent); }
  .nav a { display:block; padding:9px 10px; border-radius:8px; color:var(--text); text-decoration:none; margin-bottom:4px; }
  .nav a:hover { background:var(--panel-2); }
  .main { flex:1; padding:24px 28px; max-width:1400px; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; gap:12px; }
  .muted { color:var(--muted); }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:18px; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; }
  input, select, textarea, button { font:inherit; }
  input, select, textarea { width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--border); background:#0b1426; color:var(--text); }
  textarea { min-height:100px; resize:vertical; }
  button { background:var(--accent); color:#04111f; border:0; border-radius:8px; padding:9px 14px; font-weight:600; cursor:pointer; }
  button.secondary { background:var(--panel-2); color:var(--text); border:1px solid var(--border); }
  button.danger { background:var(--danger); color:#fff; }
  button.small { padding:5px 9px; font-size:12px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
  th { color:var(--muted); font-weight:600; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; background:var(--panel-2); border:1px solid var(--border); }
  .badge.ok { border-color:#166534; color:#86efac; }
  .badge.bad { border-color:#7f1d1d; color:#fca5a5; }
  .badge.warn { border-color:#78350f; color:#fcd34d; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .tabs button { background:var(--panel-2); color:var(--text); border:1px solid var(--border); }
  .tabs button.active { background:var(--accent); color:#04111f; }
  pre { white-space:pre-wrap; word-break:break-word; background:#0b1426; border:1px solid var(--border); border-radius:10px; padding:14px; }
  iframe { width:100%; min-height:620px; border:1px solid var(--border); border-radius:10px; background:#fff; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .hidden { display:none !important; }
  .error { color:#fca5a5; margin:10px 0; }
  .success { color:#86efac; margin:10px 0; }
  .pill { font-size:12px; color:var(--muted); }
  @media (max-width:900px) { .layout { flex-direction:column; } .sidebar { width:100%; } .main { padding:16px; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="/app.js"></script>
</body>
</html>
