[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/gateway",
    "crates/collector",
    "crates/normalizer",
    "crates/analyst",
    "crates/critic",
    "crates/reporter",
    "crates/proto",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Hackathon Team"]
rust-version = "1.99"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart", "macros"] }
base64 = "0.22"
bytes = "1"
chardetng = "0.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
csv = "1"
dotenvy = "0.15"
encoding_rs = "0.8"
dom_smoothie = "0.19"
feed-rs = "2"
futures = "0.3"
hex = "0.4"
http = "1"
ipnet = "2"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "webpki-roots"] }
jsonwebtoken = "9"
mime = "0.3"
once_cell = "1"
prometheus = "0.14"
rdkafka = { version = "0.39", default-features = false, features = ["tokio", "cmake-build", "ssl"] }
redis = { version = "0.32", features = ["tokio-rustls-comp", "connection-manager", "script"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "charset", "stream"] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json", "migrate", "macros"] }
strsim = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "limit", "set-header", "compression-gzip", "timeout", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zip = "9"
mime_guess = "2"
tonic = { version = "0.14", features = ["transport", "codegen"] }
prost = "0.14"
tonic-build = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
